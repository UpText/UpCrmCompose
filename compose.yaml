services:
  sqlserver:
    image: ${SQL_SERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    platform: ${RUNTIME_PLATFORM:-linux/amd64}
    container_name: upcrm-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
    secrets:
      - source: mssql_sa_password
        target: mssql_sa_password
        mode: 0444
    entrypoint:
      - /bin/bash
      - -c
    command:
      - if [ ! -s /run/secrets/mssql_sa_password ]; then echo "mssql_sa_password secret is missing or empty; set MSSQL_SA_PASSWORD in .env"; exit 1; fi; MSSQL_SA_PASSWORD="$$(tr -d '\r\n' < /run/secrets/mssql_sa_password)"; if [ -z "$$MSSQL_SA_PASSWORD" ]; then echo "MSSQL_SA_PASSWORD is empty after trimming line endings"; exit 1; fi; export MSSQL_SA_PASSWORD; exec /opt/mssql/bin/sqlservr
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMD="$$(command -v sqlcmd || true)"; if [ -z "$$SQLCMD" ] && [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD=/opt/mssql-tools18/bin/sqlcmd; fi; if [ -z "$$SQLCMD" ] && [ -x /opt/mssql-tools/bin/sqlcmd ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi; if [ -z "$$SQLCMD" ]; then echo "sqlcmd not found in sqlserver image"; exit 1; fi; "$$SQLCMD" -b -C -l 5 -S localhost -U sa -P "$$(cat /run/secrets/mssql_sa_password)" -Q "SELECT 1" >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  db-init:
    build:
      context: ./db
      dockerfile: init-image/Dockerfile
    platform: ${RUNTIME_PLATFORM:-linux/amd64}
    container_name: upcrm-db-init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQL_SERVER: sqlserver
      SQL_PORT: 1433
      SQL_ADMIN_USER: sa
      SQL_ADMIN_PASSWORD_FILE: /run/secrets/mssql_sa_password
      SQL_DATABASE: ${MSSQL_DB:-UpCrm}
      SQL_WAIT_TIMEOUT_SECONDS: ${SQL_WAIT_TIMEOUT_SECONDS:-300}
      ADMIN_TENANT_PASSWORD_FILE: /run/secrets/admin_tenant_password
      SERVICE_SQL_USER: ${UPAPI_SQL_USER:-upservice}
      SERVICE_SQL_PASSWORD_FILE: /run/secrets/upapi_sql_password
      SQL_LOG_SCHEMA: ${UPAPI_SQLLOG_SCHEMA:-dbo}
      SQL_LOG_TABLE: ${UPAPI_SQLLOG_TABLE:-log}
      DEPLOY_VERSION: ${DEPLOY_VERSION:-local-compose}
      GIT_COMMIT: ${GIT_COMMIT:-manual}
      DEPLOYED_BY: ${DEPLOYED_BY:-docker-compose}
      DEPLOYMENT_TARGET: ${DEPLOYMENT_TARGET:-docker-compose}
    secrets:
      - source: mssql_sa_password
        target: mssql_sa_password
        mode: 0444
      - source: admin_tenant_password
        target: admin_tenant_password
        mode: 0444
      - source: upapi_sql_password
        target: upapi_sql_password
        mode: 0444

  upapi:
    image: ${UPAPI_IMAGE:-docker.io/uptext/upapi:latest}
    platform: ${RUNTIME_PLATFORM:-linux/amd64}
    container_name: upcrm-upapi
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${UPAPI_PORT:-5092}:8080"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - JWT_SECRET="$$(cat /run/secrets/jwt_secret)" && export JWT_SECRET && exec dotnet UpApi.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      JWT_ISSUER: ${JWT_ISSUER:-UpApi}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-UpCrm}
      JWT_HOURS: ${JWT_HOURS:-8}
      SQLWEBAPI__SWAGGER: ${UPCRM_SERVICE:-crmapi}
      Cors__AllowedOrigins__0: ${UPCRM_PUBLIC_URL:-http://localhost:${UPCRM_PORT:-8082}}
      Cors__AllowedOrigins__1: http://localhost:5173
      Cors__AllowedOrigins__2: http://localhost:5174
      Services__crmapi__SqlSchema: ${UPAPI_SQL_SCHEMA:-crmapi}
      Services__crmapi__TableSchema: ${UPAPI_TABLE_SCHEMA:-crm}
      Services__crmapi__SqlConnectionString: Server=sqlserver,1433;Initial Catalog=${MSSQL_DB:-UpCrm};User ID=${UPAPI_SQL_USER:-upservice};Password={{secret:upapi_sql_password}};Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
      SqlLog__ConnectionString: Server=sqlserver,1433;Initial Catalog=${MSSQL_DB:-UpCrm};User ID=${UPAPI_SQL_USER:-upservice};Password={{secret:upapi_sql_password}};Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
      SqlLog__Schema: ${UPAPI_SQLLOG_SCHEMA:-dbo}
      SqlLog__TableName: ${UPAPI_SQLLOG_TABLE:-log}
      SqlLog__RetentionDays: ${UPAPI_SQLLOG_RETENTION_DAYS:-30}
    secrets:
      - source: jwt_secret
        target: jwt_secret
        mode: 0444
      - source: upapi_sql_password
        target: upapi_sql_password
        mode: 0444

  upcrm:
    image: ${UPCRM_IMAGE:-docker.io/uptext/upcrm:latest}
    platform: ${RUNTIME_PLATFORM:-linux/amd64}
    container_name: upcrm-ui
    restart: unless-stopped
    depends_on:
      upapi:
        condition: service_started
    ports:
      - "${UPCRM_PORT:-8082}:80"
    environment:
      VITE_SQLWEBAPI_URL: ${UPAPI_PUBLIC_URL:-http://localhost:${UPAPI_PORT:-5092}}
      VITE_SQLWEBAPI_SERVICE: ${UPCRM_SERVICE:-crmapi}

volumes:
  sqlserver-data:

secrets:
  mssql_sa_password:
    environment: MSSQL_SA_PASSWORD
  admin_tenant_password:
    environment: ADMIN_TENANT_PASSWORD
  upapi_sql_password:
    environment: UPAPI_SQL_PASSWORD
  jwt_secret:
    environment: JWT_SECRET
  external_sql_admin_password:
    environment: EXTERNAL_SQL_ADMIN_PASSWORD
