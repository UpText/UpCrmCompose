services:
  db-init:
    depends_on: {}
    environment:
      SQL_SERVER: ${EXTERNAL_SQL_SERVER:?Set EXTERNAL_SQL_SERVER in .env}
      SQL_PORT: ${EXTERNAL_SQL_PORT:-1433}
      SQL_ADMIN_USER: ${EXTERNAL_SQL_ADMIN_USER:-sa}
      SQL_ADMIN_PASSWORD_FILE: /run/secrets/external_sql_admin_password
    secrets:
      - source: external_sql_admin_password
        target: external_sql_admin_password
        mode: 0444

  upapi:
    environment:
      Services__crmapi__SqlConnectionString: Server=${EXTERNAL_SQL_SERVER:?Set EXTERNAL_SQL_SERVER in .env},${EXTERNAL_SQL_PORT:-1433};Initial Catalog=${MSSQL_DB:-UpCrm};User ID=${UPAPI_SQL_USER:-upservice};Password={{secret:upapi_sql_password}};Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
      SqlLog__ConnectionString: Server=${EXTERNAL_SQL_SERVER:?Set EXTERNAL_SQL_SERVER in .env},${EXTERNAL_SQL_PORT:-1433};Initial Catalog=${MSSQL_DB:-UpCrm};User ID=${UPAPI_SQL_USER:-upservice};Password={{secret:upapi_sql_password}};Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;
